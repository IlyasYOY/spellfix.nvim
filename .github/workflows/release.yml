name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Release type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Ensure default branch
        if: ${{ github.ref_name != github.event.repository.default_branch }}
        run: |
          echo "Releases must run from ${{ github.event.repository.default_branch }}." >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Lua and Luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.1 luarocks
          sudo luarocks install luacheck 1.2.0-1

      - name: Install StyLua
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.4.0
          args: false

      - name: Compute next version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          git fetch --force --tags origin

          latest_tag="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [ -n "$latest_tag" ] && [ "$(git rev-list "${latest_tag}..HEAD" --count)" = "0" ]; then
            echo "No commits found after $latest_tag; refusing to create an empty release." >&2
            exit 1
          fi

          latest_version="${latest_tag#v}"
          if [ -z "$latest_version" ]; then
            latest_version="0.0.0"
          fi
          IFS=. read -r major minor patch <<< "$latest_version"

          case "${{ inputs.bump }}" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac

          next_tag="v${major}.${minor}.${patch}"
          if git rev-parse "$next_tag" >/dev/null 2>&1; then
            echo "Tag $next_tag already exists." >&2
            exit 1
          fi
          echo "tag=$next_tag" >> "$GITHUB_OUTPUT"

      - name: Check
        run: make check NVIM_VERSION=v0.11.7

      - name: Tag and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --verify-tag \
            --generate-notes
